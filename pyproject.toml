[project]
name = "genomesieve"
version = "0.1.0"
description = "User-friendly tool for searching, filtering, selecting, and downloading genome datasets from NCBI."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

dependencies = [
    "PySide6",
    "ncbi-genome-download>=0.3.3,<0.4",
    "openpyxl>=3.1,<4.0",
]

[project.scripts]
genomesieve = "genomesieve.main:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genomesieve = ["assets/*.svg"]