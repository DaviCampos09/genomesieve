[project]
name = "genomesieve"
version = "0.1.0"
description = "User-friendly tool for searching, filtering, selecting, and downloading genome datasets from NCBI."
requires-python = ">=3.10"

dependencies = [
    "PySide6",
    "ncbi-genome-download>=0.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]